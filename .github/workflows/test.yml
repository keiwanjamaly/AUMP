name: Test

on:
  push:
  pull_request:

jobs:
  shell-and-bats:
    name: Shell and Bats
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats shellcheck

      - name: Check shell scripts
        run: |
          shellcheck AUMP/aump
          test -x AUMP/aump
          test -x AUMP/Runner.wls
          test -x AUMP/Worker.wls

      - name: Run Bats harness
        run: bats TestHarness/bats

  wolfram:
    name: Wolfram Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require WolframScript entitlement
        env:
          WOLFRAMSCRIPT_ENTITLEMENTID: ${{ secrets.WOLFRAMSCRIPT_ENTITLEMENTID }}
        shell: bash
        run: |
          if [ -z "$WOLFRAMSCRIPT_ENTITLEMENTID" ]; then
            echo "WOLFRAMSCRIPT_ENTITLEMENTID is required for Wolfram tests on GitHub-hosted runners." >&2
            exit 1
          fi

      - name: Pull Wolfram Engine image
        run: docker pull wolframresearch/wolframengine:latest

      - name: Validate WolframScript entitlement
        env:
          WOLFRAMSCRIPT_ENTITLEMENTID: ${{ secrets.WOLFRAMSCRIPT_ENTITLEMENTID }}
        shell: bash
        run: |
          docker run --rm \
            -e WOLFRAMSCRIPT_ENTITLEMENTID \
            wolframresearch/wolframengine:latest \
            wolframscript -code '$VersionNumber'

      - name: Run AUMP self-tests in Wolfram Engine container
        env:
          WOLFRAMSCRIPT_ENTITLEMENTID: ${{ secrets.WOLFRAMSCRIPT_ENTITLEMENTID }}
        run: |
          docker run --rm \
            -e WOLFRAMSCRIPT_ENTITLEMENTID \
            -v "$PWD:/work" \
            -w /work \
            wolframresearch/wolframengine:latest \
            bash -lc 'AUMP/aump --path Tests --reporter junit --output aump-self-tests.xml'

      - name: Run integration fixtures in Wolfram Engine container
        env:
          WOLFRAMSCRIPT_ENTITLEMENTID: ${{ secrets.WOLFRAMSCRIPT_ENTITLEMENTID }}
        run: |
          docker run --rm \
            -e WOLFRAMSCRIPT_ENTITLEMENTID \
            -v "$PWD:/work" \
            -w /work \
            wolframresearch/wolframengine:latest \
            bash -lc '
              AUMP/aump --path TestHarness/fixtures/passing
              AUMP/aump --path TestHarness/fixtures/sections
              AUMP/aump --path TestHarness/fixtures/isolation
              AUMP/aump --path TestHarness/fixtures/output --reporter json
              AUMP/aump --path TestHarness/fixtures/skip --reporter junit --output aump-skip-tests.xml
              AUMP/aump -- --path TestHarness/fixtures/passing
              AUMP/aump --path TestHarness/fixtures/discovery --pattern Selected.m --list-tests
              AUMP/aump --path TestHarness/fixtures/package/tests --wl-path TestHarness/fixtures/package --init TestHarness/fixtures/package/init.m
            '

      - name: Verify expected failures in Wolfram Engine container
        env:
          WOLFRAMSCRIPT_ENTITLEMENTID: ${{ secrets.WOLFRAMSCRIPT_ENTITLEMENTID }}
        run: |
          docker run --rm \
            -e WOLFRAMSCRIPT_ENTITLEMENTID \
            -v "$PWD:/work" \
            -w /work \
            wolframresearch/wolframengine:latest \
            bash -lc '
              set +e
              AUMP/aump --path TestHarness/fixtures/failing --tag check --reporter json
              check_status=$?
              AUMP/aump --path TestHarness/fixtures/failing --tag require --reporter json
              require_status=$?
              AUMP/aump --path TestHarness/fixtures/syntax_error
              syntax_status=$?
              AUMP/aump --path TestHarness/fixtures/timeout --timeout 1 --reporter json
              timeout_status=$?
              set -e

              test "$check_status" -ne 0
              test "$require_status" -ne 0
              test "$syntax_status" -eq 2
              test "$timeout_status" -ne 0
            '

      - name: Upload Wolfram test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: wolfram-test-reports
          path: |
            aump-self-tests.xml
            aump-skip-tests.xml
          if-no-files-found: ignore
